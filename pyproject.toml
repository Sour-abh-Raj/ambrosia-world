[project]
name = "ambrosia-world"
version = "2.0.0"
description = "A modular, deterministic agent world: one city per machine, a heaven, an economy and live monitors. Built on LangGraph, DBOS, NATS, Mesa and FastAPI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Sourabh Raj" }]
keywords = ["agents", "multi-agent", "orchestration", "langgraph", "dbos", "nats", "mesa", "simulation"]
dependencies = [
  "langgraph>=1.2",                 # agent orchestration (deterministic state graphs, interrupts)
  "langgraph-checkpoint-sqlite>=3", # God's conversation memory + approvals
  "dbos>=3.2",                      # pipeline orchestration (durable, exactly-once steps, queues)
  "nats-py>=2.16",                  # the road between cities (JetStream, leaf nodes, domains)
  "mesa>=3.3",                      # the economy (agent-based model)
  "networkx>=3.3",                  # mesa's network space
  "fastapi>=0.140",                 # monitors
  "uvicorn>=0.35",
  "pydantic>=2.10",                 # the control sheet schema
  "tomlkit>=0.13",                  # edits world.toml without losing comments
  "typer>=0.15",
  "httpx>=0.28",
  "zeroconf>=0.140",                # LAN discovery of cities
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
world = "ambrosia_world.cli:main"

[project.urls]
Homepage = "https://github.com/Sour-abh-Raj/ambrosia-world"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ambrosia_world"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
